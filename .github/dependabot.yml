# Synced from wshno/devops settings-sync/files/dependabot/skylens.yml (built by
# settings-sync/dependabot/build.py): change it there. Stack: hwinther/skylens: GitHub Actions, Docker, NuGet, npm with the Expo SDK pins.
#
# Directories are single-level wildcards, one per depth ('/', '/*', '/*/*'); directories without a
# manifest are skipped. Cooldown: 7 days, 14 for GitHub Actions, so the synced workflows are updated
# in wshno/devops (Renovate, 7 days) and synced before Dependabot here proposes the same bump.
# Groups: a dependency goes to the FIRST group that matches; groups that match nothing are harmless.
# Commit messages and PR titles are Conventional Commits, chore(deps): / chore(deps-dev):, so the
# Type label workflow labels them and tag-and-release counts them as patch.

version: 2
updates:
  - package-ecosystem: 'github-actions'
    directories:
      - '/'
      - '/.github/actions/*'
    open-pull-requests-limit: 20
    schedule:
      interval: 'weekly'
      day: 'sunday'
    cooldown:
      default-days: 14
    commit-message:
      prefix: 'chore'
      include: 'scope'
    assignees:
      - 'hwinther'
    groups:
      reusable-workflows:
        patterns:
          - 'hwinther/reusable-workflows*'

  - package-ecosystem: 'docker'
    directories:
      - '/'
      - '/*'
      - '/*/*'
      - '/.github/actions/*'
    open-pull-requests-limit: 20
    schedule:
      interval: 'weekly'
      day: 'sunday'
    cooldown:
      default-days: 7
    commit-message:
      prefix: 'chore'
      include: 'scope'
    assignees:
      - 'hwinther'
    groups:
      base-images:
        patterns:
          - '*'

  - package-ecosystem: 'nuget'
    directories:
      - '/'
      - '/*'
      - '/*/*'
    open-pull-requests-limit: 20
    schedule:
      interval: 'weekly'
      day: 'sunday'
    cooldown:
      default-days: 7
    commit-message:
      prefix: 'chore'
      include: 'scope'
    assignees:
      - 'hwinther'
    # update-dotnet-lockfiles triggers the synced dependabot-update-dotnet-lockfiles.yml, which
    # regenerates every project's packages.lock.json (Dependabot only rewrites the bumped project's,
    # so projects referencing it fail the locked-mode restore, NU1004). Setting labels replaces
    # Dependabot's defaults, so those are listed too.
    labels:
      - 'dependencies'
      - '.NET'
      - 'update-dotnet-lockfiles'
    groups:
      roslyn:
        patterns:
          - 'Microsoft.CodeAnalysis.*'
      testing:
        patterns:
          - 'xunit'
          - 'xunit.*'
          - 'nunit'
          - 'nunit.*'
          - 'NUnit*'
          - 'coverlet.*'
          - 'Microsoft.Testing.*'
          - 'Microsoft.NET.Test.Sdk'
      microsoft:
        patterns:
          - 'Microsoft.*'
          - 'System.*'
        exclude-patterns:
          - 'Microsoft.OpenApi'
      swashbuckle:
        patterns:
          - 'Swashbuckle.*'
      opentelemetry:
        patterns:
          - 'OpenTelemetry.*'

  - package-ecosystem: 'npm'
    directories:
      - '/'
      - '/*'
      - '/*/*'
    open-pull-requests-limit: 20
    schedule:
      interval: 'weekly'
      day: 'sunday'
    cooldown:
      default-days: 7
    commit-message:
      prefix: 'chore'
      include: 'scope'
    assignees:
      - 'hwinther'
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-patch']
      # typescript-eslint, which @wshno/eslint-config builds on, supports TypeScript <6.1. Drop this
      # once a typescript-eslint release widens that range.
      - dependency-name: 'typescript'
        versions: ['>=6.1']
      # Expo SDK pins: minor/major moves only with an Expo SDK upgrade (`npx expo install --fix`).
      - dependency-name: 'expo'
        update-types: ['version-update:semver-minor', 'version-update:semver-major']
      - dependency-name: 'expo-*'
        update-types: ['version-update:semver-minor', 'version-update:semver-major']
      - dependency-name: '@expo/*'
        update-types: ['version-update:semver-minor', 'version-update:semver-major']
      - dependency-name: 'react'
        update-types: ['version-update:semver-minor', 'version-update:semver-major']
      - dependency-name: 'react-dom'
        update-types: ['version-update:semver-minor', 'version-update:semver-major']
      - dependency-name: 'react-native'
        update-types: ['version-update:semver-minor', 'version-update:semver-major']
      - dependency-name: 'react-native-*'
        update-types: ['version-update:semver-minor', 'version-update:semver-major']
      - dependency-name: '@react-native/*'
        update-types: ['version-update:semver-minor', 'version-update:semver-major']
      - dependency-name: '@types/react'
        update-types: ['version-update:semver-minor', 'version-update:semver-major']
      - dependency-name: 'jest-expo'
        update-types: ['version-update:semver-minor', 'version-update:semver-major']
      - dependency-name: 'eslint-config-expo'
        update-types: ['version-update:semver-minor', 'version-update:semver-major']
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-minor', 'version-update:semver-major']
      - dependency-name: 'eslint'
        update-types: ['version-update:semver-major']
    groups:
      expo:
        patterns:
          - 'expo'
          - 'expo-*'
          - '@expo/*'
      wshno:
        patterns:
          - '@wshno/*'
          - 'eslint'
          - 'prettier'
      react-router:
        patterns:
          - 'react-router'
          - 'react-router-*'
          - '@react-router/*'
      react:
        patterns:
          - 'react'
          - 'react-*'
          - '@types/react*'
      vite:
        patterns:
          - 'vite'
          - 'vite-*'
          - '@vitejs/*'
      testing:
        patterns:
          - 'vitest'
          - '@vitest/*'
          - '@testing-library/*'
          - 'jsdom'
          - 'msw'
      playwright:
        patterns:
          - '@playwright/*'
          - 'playwright*'
      tanstack:
        patterns:
          - '@tanstack/*'
      opentelemetry:
        patterns:
          - '@opentelemetry/*'
      stryker:
        patterns:
          - '@stryker-mutator/*'
      astro:
        patterns:
          - 'astro'
          - '@astrojs/*'
      ui-libraries:
        patterns:
          - 'bootstrap*'
          - 'd3*'
          - '@visx/*'
          - '@icon/*'
          - 'jquery*'
          - 'datatables*'
      eslint:
        patterns:
          - 'eslint-*'
          - '@eslint/*'
          - 'typescript-eslint'
          - '@typescript-eslint/*'
          - '@eslint-react/*'
          - '*/eslint-plugin'
          - '*/eslint-plugin-*'
          - 'globals'
      types:
        patterns:
          - '@types/*'
      build-tools:
        patterns:
          - 'typescript'
          - 'typescript-*'
          - 'orval'
          - 'openapi-typescript-codegen'
      code-quality:
        patterns:
          - '@cspell/*'
      utilities:
        patterns:
          - 'dotenv'
