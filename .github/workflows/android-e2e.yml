name: "Android E2E (Maestro)"

# Smoke-tests the Android app on an emulator: prebuild the Expo (CNG) project, build a release APK
# (the Expo template signs release with its debug keystore, so the JS bundle is embedded and no Metro
# is needed), boot an API 34 emulator and run the Maestro flows in app/.maestro. The app runs in demo
# mode (no EXPO_PUBLIC_FORCE_LIVE), so it needs no backend and no sign-in.
#
# Triggers: nightly, manual dispatch, and PRs labelled `mobile-e2e` (not every PR: a run takes a
# while). Adding the label starts a run; later pushes to the labelled PR re-run it.
#
# Optional repository secret:
#   GOOGLE_MAPS_API_KEY  — Maps SDK key, so the Map tab opens on the map. Fork PRs get no secrets: the
#                          build still succeeds (app.config.js only warns) and the app opens the Map
#                          tab on the Radar, which the flow accepts.
#
# Third-party actions are pinned to full commit SHAs (repo policy / zizmor blanket-pin); the trailing
# comment tracks the version. The Maestro CLI is a pinned release zip checked against its published
# SHA-256, not the curl|bash installer.
#
# Caching (unlike android-build.yml, which signs a release and restores nothing): this job only builds a
# throwaway APK signed with the Expo template's public debug keystore, so a poisoned cache could at worst
# break or skew this smoke test, not ship anything. Two caches, both written only from main (nightly or a
# dispatch on main) and only read by PR runs, so a labelled PR can't plant entries that main later uses:
#  - Gradle User Home (dependencies, wrapper, transforms) via setup-gradle with the open-source `basic`
#    provider; its default cache-read-only already means "write from the default branch only". The Gradle
#    build cache (--build-cache) is left off on purpose: its task outputs (merged manifest, generated
#    Expo config) would carry GOOGLE_MAPS_API_KEY into a cache that fork PRs can read.
#  - ccache for the NDK C++ compile (most of the build). CMAKE_C/CXX_COMPILER_LAUNCHER from the
#    environment (CMake >= 3.17) puts ccache in front of every library's CMake build. Keyed on
#    package-lock.json + this file (native sources only change with dependencies); saved only when that
#    key had no exact hit; a new key restores the newest older entry first. If ccache can't be
#    installed, the build runs without it.

on:
  schedule:
    - cron: "17 3 * * *" # nightly, 03:17 UTC
  workflow_dispatch:
  pull_request:
    types: [opened, reopened, labeled, synchronize]

permissions:
  contents: read

env:
  MAESTRO_VERSION: "2.12.1"
  MAESTRO_SHA256: "54dbb0716425626604973cbb374c585ca30272375d9ce15177a1152765ddd9d7"

jobs:
  smoke:
    name: Maestro smoke (emulator)
    # PRs only with the mobile-e2e label.
    if: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'mobile-e2e') }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    # Job-level, so a run skipped by the `if` above (e.g. some other label added) doesn't cancel a
    # running smoke test.
    concurrency:
      group: "${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}"
      cancel-in-progress: true
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.x"

      - name: Setup JDK
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm ci # app/.npmrc pins legacy-peer-deps=true

      - name: Prebuild native Android project
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: npx expo prebuild -p android --no-install

      # After prebuild, so its wrapper validation checks the generated gradle-wrapper.jar too.
      - name: Setup Gradle (dependency cache)
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic
          add-job-summary: on-failure

      # Writes the ccache settings to GITHUB_ENV only once ccache is actually installed: the compiler
      # launcher must not point at a missing binary.
      - name: Install ccache
        run: |
          if sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends ccache; then
            {
              echo "CCACHE_DIR=$HOME/.cache/ccache"
              echo "CCACHE_MAXSIZE=2G"
              # Runner images update the NDK in place; hash the compiler binary, not its mtime.
              echo "CCACHE_COMPILERCHECK=content"
              # Needed for hits with precompiled headers (expo-modules-core, reanimated, worklets build
              # with -fno-pch-timestamp for this) and with headers that codegen writes during the build.
              echo "CCACHE_SLOPPINESS=pch_defines,time_macros,include_file_mtime,include_file_ctime"
              # expo-modules-core writes a path-independent .sum next to its PCH; others fall back to
              # hashing the PCH itself.
              echo "CCACHE_PCH_EXTSUM=true"
              echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE"
              echo "CMAKE_C_COMPILER_LAUNCHER=ccache"
              echo "CMAKE_CXX_COMPILER_LAUNCHER=ccache"
            } >> "$GITHUB_ENV"
            ccache --version | head -n 1
          else
            echo "::warning::Could not install ccache; building without it"
          fi

      - name: Restore ccache
        id: ccache-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ccache
          # This workflow file too, so a change to the ccache settings starts a fresh entry.
          key: ccache-android-x86_64-${{ hashFiles('app/package-lock.json', '.github/workflows/android-e2e.yml') }}
          restore-keys: |
            ccache-android-x86_64-

      - name: Build release APK (x86_64 only)
        working-directory: app/android
        env:
          # The embedded Expo config (extra.hasMapsKey) is generated during the Gradle build, so the
          # key is needed here too, not just at prebuild.
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          # Inlined into the JS bundle (built inside this Gradle task): the cockpit view puts its globe
          # diagnostics on a hidden `sim-globe-diag` node that the Maestro flow reads (src/sim/globeDiag.ts).
          EXPO_PUBLIC_SIM_DIAG: "1"
        # --no-daemon: one Gradle invocation per job, so a daemon would only linger.
        run: |
          chmod +x gradlew
          if command -v ccache > /dev/null; then ccache --zero-stats; fi
          ./gradlew :app:assembleRelease --no-daemon -PreactNativeArchitectures=x86_64

      - name: ccache statistics
        if: ${{ !cancelled() }}
        run: if command -v ccache > /dev/null; then ccache --show-stats --verbose; else echo "ccache not installed"; fi

      # main only (nightly / dispatch; a schedule event has no github.event.repository, hence the
      # literal ref), and only when this key's entry is new. Right after the
      # build, so a failing Maestro run still keeps the compile results.
      - name: Save ccache
        if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.ccache-restore.outputs.cache-hit != 'true' && env.CCACHE_DIR != '' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ccache
          key: ${{ steps.ccache-restore.outputs.cache-primary-key }}

      - name: Install Maestro CLI
        run: |
          curl -fsSL -o "$RUNNER_TEMP/maestro.zip" \
            "https://github.com/mobile-dev-inc/maestro/releases/download/cli-${MAESTRO_VERSION}/maestro.zip"
          echo "${MAESTRO_SHA256}  $RUNNER_TEMP/maestro.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/maestro/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/maestro/bin/maestro" --version

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Maestro flows on emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          APK_PATH: android/app/build/outputs/apk/release/app-release.apk
          MAESTRO_OUT: ${{ runner.temp }}/maestro-out
          MAESTRO_CLI_NO_ANALYTICS: "1"
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          # The runner's default is 2. On the first run the emulator was CPU-starved after boot
          # (`input keyevent 82` took 9 s, system_server and SystemUI logged slow Looper dispatches)
          # and Pixel Launcher went ANR. Public-repo ubuntu-latest runners have 4 vCPUs; one is left
          # for the host side (SwiftShader rendering, Maestro's JVM).
          cores: 3
          disable-animations: true
          working-directory: app
          # Each line runs as its own `sh -c` and the first failing line stops the script. So the
          # Maestro line records its exit code instead of failing, the diagnostics after it run either
          # way (`|| true`), and the last line fails the step if the flows failed.
          #  - hide_error_dialogs=1: an app that goes ANR is killed instead of covering the screen
          #    with an "<app> isn't responding" dialog (AOSP ActivityTaskManagerService/AppErrors;
          #    the setting is observed live on API 34). Our own app going ANR still fails the flow.
          #  - wait-for-broadcast-idle: let the BOOT_COMPLETED fan-out settle before the test starts.
          #  - logcat -G 16M (the emulator sets 2M, which had rotated out everything before the flow's
          #    first command) and no `logcat -c`, so the dump keeps boot; `events` has am_anr/am_crash.
          #  - sim-diag.txt: the cockpit globe's "SkylensSim" lines (native, webview console, Maestro) from
          #    Maestro's per-flow device logcat (logd can prune the app's lines from the final dump) and
          #    maestro.log; the tail is printed to the job log.
          script: |
            mkdir -p "$MAESTRO_OUT"
            adb shell settings put global hide_error_dialogs 1
            adb logcat -G 16M || echo "::warning::Could not resize the logcat buffer"
            timeout 300 adb shell am wait-for-broadcast-idle || echo "::warning::Broadcast queues not idle after 300 s; starting anyway"
            adb install -r "$APK_PATH"
            adb shell dumpsys window | grep -E 'mCurrentFocus|mFocusedApp' || true
            adb exec-out screencap -p > "$MAESTRO_OUT/pre-test-screen.png" || true
            maestro test --format junit --output "$MAESTRO_OUT/report.xml" --test-output-dir "$MAESTRO_OUT/artifacts" --debug-output "$MAESTRO_OUT/debug" .maestro || echo "$?" > "$MAESTRO_OUT/maestro-exit-code"
            adb exec-out screencap -p > "$MAESTRO_OUT/post-test-screen.png" || true
            adb logcat -d -b main,system,crash,events > "$MAESTRO_OUT/logcat.txt" || true
            { grep -rh SkylensSim "$MAESTRO_OUT/artifacts"; grep -h SkylensSim "$MAESTRO_OUT/logcat.txt"; } > "$MAESTRO_OUT/sim-diag.txt" || true
            tail -n 40 "$MAESTRO_OUT/sim-diag.txt" || true
            adb shell dumpsys activity activities > "$MAESTRO_OUT/dumpsys-activities.txt" || true
            for t in system_app_anr data_app_anr system_app_crash data_app_crash; do echo "=== dropbox $t"; adb shell dumpsys dropbox --print "$t"; done > "$MAESTRO_OUT/dropbox-anr-crash.txt" 2>&1 || true
            test ! -s "$MAESTRO_OUT/maestro-exit-code" || { echo "::error::Maestro flows failed (exit $(cat "$MAESTRO_OUT/maestro-exit-code"))"; exit 1; }

      # Always, not only on failure: a passing run's screenshots are the only view of the native UI.
      # Short retention; the attempt number keeps a re-run from colliding with the first upload.
      - name: Upload Maestro output
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: maestro-output-${{ github.run_attempt }}
          path: ${{ runner.temp }}/maestro-out
          retention-days: 7
          if-no-files-found: warn
