name: "Create release"

# Creates the v* tag (auto = next version from GitVersion) and, optionally, the GitHub Release.
# The tag is pushed with the wshno-devops-bot GitHub App's token, so the push itself starts
# container.yml ("Publish release") and the signed manifests artifact.
# (A tag pushed with GITHUB_TOKEN wouldn't trigger them, which is why this used to dispatch them.)
#
# Grype gate in the way (vulnerabilities we can't fix yet)? Let the build fail, then run
# container.yml by hand at the tag ("Use workflow from" -> the tag) with "Fail the build" off.
#
# Needs: repository variable DEVOPS_BOT_CLIENT_ID, secret DEVOPS_BOT_PRIVATE_KEY, and the App
# installed on this repo with Contents: write.

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Version tag (e.g. v1.2.3), or 'auto' for the next version"
        required: false
        default: "auto"
      release_notes:
        description: "Release notes"
        required: false
      create_release:
        description: "Also create a GitHub Release"
        type: boolean
        default: true
      build_android:
        description: "Also build the Android app (android-build.yml at this version)"
        type: boolean
        default: true
      android_upload_to_play:
        description: "Have the Android build upload the AAB to the Play internal-testing track"
        type: boolean
        default: false

permissions: {}

jobs:
  tag:
    permissions:
      contents: write
    uses: hwinther/reusable-workflows/.github/workflows/tag-and-release.yml@9a681fd609e4169b4293a0c4409acce9f809cb77 # v2.26.1
    with:
      tag_name: ${{ inputs.tag_name }}
      release_notes: ${{ inputs.release_notes }}
      create_release: ${{ inputs.create_release }}
      app_client_id: ${{ vars.DEVOPS_BOT_CLIENT_ID }}
    secrets:
      app_private_key: ${{ secrets.DEVOPS_BOT_PRIVATE_KEY }}

  # The Android app is optional per release and has its own options, so it is still dispatched
  # (android-build.yml's own tag trigger is app-v*, kept separate from the backend's v* tags).
  android-build:
    needs: tag
    if: ${{ success() && inputs.build_android }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Dispatch android-build.yml at the release tag
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.tag.outputs.tag_name }}
          UPLOAD_TO_PLAY: ${{ inputs.android_upload_to_play }}
        run: |
          set -euo pipefail
          [ -n "$TAG" ] || { echo "::error::The tag job reported no tag name."; exit 1; }
          gh workflow run android-build.yml -R "$REPO" --ref "$TAG" -f version="${TAG#v}" -f upload_to_play="$UPLOAD_TO_PLAY"
