name: "Prune GHCR images"

# Thin caller. Pruning logic lives in
# hwinther/reusable-workflows/.github/workflows/prune-ghcr.yml (see its header for the rules).
#
# Auth note:
#   ghcr.io/hwinther/* is a USER-scoped registry. The repo's GITHUB_TOKEN can delete versions only
#   when the package has "Inherit access from source repository" enabled. If deletion 403s, set repo
#   secret GHCR_PRUNE_TOKEN to a PAT with `delete:packages` (+ `read:packages`), passed via
#   secrets: inherit.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "When false, actually delete versions. Cron runs always force false."
        type: boolean
        default: true
      images:
        description: "Comma-separated package names to prune. Blank = auto-discover by prefix."
        type: string
        default: "skylens/api,skylens/manifests"
      nuke_package:
        description: "DESTRUCTIVE. Package name to delete entirely — leave blank for normal prune."
        type: string
        default: ""
  schedule:
    # Sundays 03:00 UTC. Cron always runs live (dry_run forced to false).
    - cron: "0 3 * * 0"

permissions:
  contents: read
  packages: write
  pull-requests: read

concurrency:
  group: prune-ghcr
  cancel-in-progress: false

jobs:
  prune:
    permissions:
      contents: read
      packages: write
      # v2.4.0 looks up open PRs to keep their pr-<N> / PullRequest<N> tags.
      pull-requests: read
    uses: hwinther/reusable-workflows/.github/workflows/prune-ghcr.yml@c1e80ad637dcdd38bb6de0f447475c40a8625141 # v2.9.0
    with:
      # Scheduled runs prune for real; manual runs use the input. The old expression handed the
      # required boolean input a null on a schedule, so no scheduled run ever started.
      dry_run: ${{ github.event_name != 'schedule' && inputs.dry_run }}
      images: ${{ inputs.images || 'skylens/api,skylens/manifests' }}
      package_namespace_prefix: skylens/
      nuke_package: ${{ inputs.nuke_package || '' }}
    # Passes the optional GHCR_PRUNE_TOKEN through to the pinned reusable prune workflow (which reads
    # it via inherit). Accepted + documented in .github/zizmor.yml (secrets-inherit).
    secrets: inherit
