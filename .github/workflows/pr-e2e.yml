name: E2E

# Every PR that changes the image: build -> {Grype scan, Playwright e2e} in parallel. With the
# `deploy-feature` label the image that passed e2e is also promoted and an ephemeral preview env is
# deployed to the homelab cluster via GitOps (the per-PR overlay under
# clusters/production/apps/previews/skylens in hwinther/proxmox; Flux reconciles within ~1 min).
#
# On same-repo PRs the build pushes a staging tag (pr-<N>-<sha7>) and hands on repo@digest, so the
# scan, e2e and the push all use the same bytes; Dependabot PRs fall back to a workflow artifact.
# prune-ghcr.yml deletes staging tags once the PR is closed, and pr-preview-cleanup.yml removes the
# preview.
#
# The preview runs the backend in Development mode (MQTT replay of the baked-in fixture), so it needs
# no broker and no database; the Authelia forward-auth ingress is the gate. Requires repo variable
# PROXMOX_GITOPS_CLIENT_ID + secret PROXMOX_GITOPS_APP_PRIVATE_KEY (the GitHub App that can commit to
# hwinther/proxmox).

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    types: [opened, reopened, labeled, synchronize, ready_for_review]
    paths:
      - "backend/**"
      - "app/**"
      - "e2e/**"
      - "Dockerfile"
      - ".dockerignore"
      - "docker-compose.e2e.yml"
      # A PR labelled deploy-feature previews its manifest changes.
      - "deploy/**"
      - ".github/workflows/pr-e2e.yml"
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "app/**"
      - "e2e/**"
      - "Dockerfile"
      - ".dockerignore"
      - "docker-compose.e2e.yml"
      # A PR labelled deploy-feature previews its manifest changes.
      - "deploy/**"
      - ".github/workflows/pr-e2e.yml"

concurrency:
  group: "${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}"
  cancel-in-progress: true

jobs:
  # The tag for builds of main: main-<sha7>, also used for the quality artifact below.
  main-tag:
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: main-<sha7>
        id: tag
        run: echo "tag=main-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

  # Unit tests and coverage for builds of main, so quality (below) covers the whole repo. Same
  # inputs as ci.yml, which runs them on pull requests; on push pr-build tests every stack
  # rather than diffing against main.
  unit:
    if: ${{ github.event_name == 'push' }}
    permissions:
      contents: read
      checks: write
      pull-requests: write
      packages: read
    uses: hwinther/reusable-workflows/.github/workflows/pr-build.yml@6b6810e17143f38ac9dc0f84d504e7ff08b1d2bf # v2.26.0
    with:
      node_enabled: true
      node_version: "26.x"
      node_working_directory: "app"
      # Include the backend contract so a PR that touches openapi.json re-runs the node job; the extra
      # command regenerates the typed client and the workflow fails on any uncommitted drift. It also
      # runs the node --test suite of the Maestro summary script (app/.maestro/scripts), which jest
      # does not pick up.
      node_changes_regex: "app/.*|backend/src/Api/openapi.json"
      node_extra_command: "npm run openapi:generate && npm run test:scripts"
      dotnet_enabled: true
      dotnet_version: "10.0.x"
      dotnet_working_directory: "backend"
      dotnet_solution_file: "Skylens.slnx"

  build:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    permissions:
      contents: read
      packages: write
    uses: hwinther/reusable-workflows/.github/workflows/build-image-docker.yml@6b6810e17143f38ac9dc0f84d504e7ff08b1d2bf # v2.26.0
    with:
      container_registry: ghcr.io
      container_image_name_postfix: api
      build_context: .
      dockerfile: Dockerfile

  # Runs next to e2e rather than before it. auto = report/SARIF/comment only on PRs.
  scan:
    needs: [build]
    permissions:
      contents: read
      packages: read
      actions: read
      security-events: write
      pull-requests: write
    uses: hwinther/reusable-workflows/.github/workflows/scan-image.yml@6b6810e17143f38ac9dc0f84d504e7ff08b1d2bf # v2.26.0
    with:
      image: ${{ needs.build.outputs.image }}
      container_image_name_postfix: api
      grype_fail_build: auto

  # Container mode (playwright.ci.config.ts): Playwright drives the combined image from
  # docker-compose.e2e.yml; API_IMAGE is set to the hand-off before `docker compose up`.
  # The @wshno/playwright-config version the e2e image builds on: the one e2e/'s lock file resolves,
  # so the image's browser matches the suite's Playwright.
  e2e-base:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      playwright_config: ${{ steps.lock.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "@wshno/playwright-config from the lock file"
        id: lock
        run: |
          set -euo pipefail
          v=$(jq -r '.packages["node_modules/@wshno/playwright-config"].version' e2e/package-lock.json)
          [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::No @wshno/playwright-config version"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"

  # The test runner: e2e/'s specs and npm packages on @wshno/playwright-config's runner image, run
  # below as the `playwright` service of docker-compose.e2e.yml. Built and handed on like the API
  # image, so e2e needs no Node or browsers on the runner.
  e2e-image:
    needs: [e2e-base]
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    permissions:
      contents: read
      packages: write
    uses: hwinther/reusable-workflows/.github/workflows/build-image-docker.yml@6b6810e17143f38ac9dc0f84d504e7ff08b1d2bf # v2.26.0
    with:
      container_registry: ghcr.io
      container_image_name_postfix: e2e
      build_context: e2e
      dockerfile: e2e/Dockerfile
      build_args: PLAYWRIGHT_CONFIG_VERSION=${{ needs.e2e-base.outputs.playwright_config }}

  e2e:
    needs: [build, e2e-image]
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    permissions:
      contents: read
      packages: read
      pull-requests: write
      actions: read
    uses: hwinther/reusable-workflows/.github/workflows/playwright-e2e.yml@56a8121d7a91b3c48c444c7b3fde8d0801320f08 # v2.35.0
    with:
      compose_file: docker-compose.e2e.yml
      # The suite runs from the e2e image as a compose service (`npm run test:ci`), not with Node and
      # browsers on the runner: the same `docker compose --profile e2e run --rm playwright` as locally.
      compose_playwright_service: playwright
      playwright_working_directory: e2e
      # The API traces to the stack's collector; API requests over 2 s are reported in the job
      # summary and the PR comment.
      otel_traces_file: e2e/otel-out/traces.jsonl
      slow_span_threshold_ms: 2000
      report_paths_json: '["playwright-report","test-results","otel-out"]'
      # Browser JS coverage of the web bundle (monocart-reporter in playwright.ci.config.ts), uploaded
      # as the e2e-coverage artifact; coverage-summary below merges it with the jest coverage.
      coverage_paths_json: '["monocart-coverage"]'
      image_artifacts_json: |
        {"API_IMAGE":"${{ needs.build.outputs.image }}",
         "E2E_IMAGE":"${{ needs.e2e-image.outputs.image }}"}

  # Unit + e2e line coverage, kept apart from ci.yml's unit-test comment: its own job summary and
  # sticky PR comment. On builds of main the unit side is the unit job's quality-node artifact; pull
  # requests (whose unit tests run in ci.yml) re-run jest with coverage. Merged with the e2e-coverage
  # artifact by @wshno/playwright-config's wshno-coverage-summary (approximate: istanbul vs V8 line
  # accounting). Informational only; nothing gates on it.
  coverage-summary:
    needs: [unit, e2e]
    if: ${{ !cancelled() && needs.e2e.result != 'skipped' }}
    permissions:
      contents: read
      pull-requests: write
    uses: hwinther/reusable-workflows/.github/workflows/e2e-coverage-summary.yml@f55297593d7ac787485fedaf3cb83b63030bc629 # v2.36.0
    with:
      source_root: app
      source_dirs: src,app
      # jest-config parity: collectCoverageFrom in app/jest.config.js leaves out the demo feed.
      unit_label: Unit (jest)
      unit_coverage_command: npm run coverage:ci
      unit_working_directory: app
      node_version: "26.x"
      comment_identifier: skylens-coverage-combined

  # On main too (api:main-<sha7> and :main), for the manifests below.
  push:
    needs: [main-tag, build, scan, e2e]
    if: ${{ (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'deploy-feature')) || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      actions: read
    uses: hwinther/reusable-workflows/.github/workflows/image-push.yml@6b6810e17143f38ac9dc0f84d504e7ff08b1d2bf # v2.26.0
    with:
      container_registry: ghcr.io
      container_image_name_postfix: api
      artifact_name: ${{ needs.build.outputs.image }}
      container_image_tags: ${{ github.event_name == 'push' && format('ghcr.io/hwinther/skylens/api:{0},ghcr.io/hwinther/skylens/api:main', needs.main-tag.outputs.tag) || needs.build.outputs.container_image_tags }}
      image_digest: ${{ needs.build.outputs.image_digest }}
      version: ${{ github.event_name == 'push' && needs.main-tag.outputs.tag || needs.build.outputs.version }}
      sbom_artifact_name: ${{ needs.scan.outputs.sbom_artifact }}
      grype_artifact_name: ${{ needs.scan.outputs.grype_artifact }}
      sbom_cyclonedx_sha256: ${{ needs.scan.outputs.sbom_cyclonedx_sha256 }}
      grype_json_sha256: ${{ needs.scan.outputs.grype_json_sha256 }}

  # The preview deploys from a rendered, signed manifest artifact (deploy/ + components/preview),
  # so manifest changes in a PR run in its preview before they reach a release. The cluster repo's
  # preview template pins it by digest and only accepts this workflow's signature.
  # On main too (manifests:main-<sha7> and :main), for nightly-preview.yml, which deploys :main.
  manifests:
    needs: [main-tag, build, push]
    if: ${{ (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'deploy-feature')) || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      TAG: ${{ github.event_name == 'push' && needs.main-tag.outputs.tag || format('pr-{0}', github.event.pull_request.number) }}
    outputs:
      tag: ${{ env.TAG }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Render, validate, push and sign
        id: push
        uses: hwinther/reusable-workflows/.github/actions/manifests@1fa5882e8aa1048af78492baf016f5a7b310be11 # v2.29.0
        with:
          mode: push
          artifact: ghcr.io/hwinther/skylens/manifests
          tag: ${{ env.TAG }}
          images: ghcr.io/hwinther/skylens/api:${{ github.event_name == 'push' && needs.main-tag.outputs.tag || needs.build.outputs.version }}@${{ needs.push.outputs.image_digest }}
          renders: skylens.yaml=deploy,components/preview

      # The nightly preview env deploys whatever :main points at. Same digest, so the signature
      # made above covers it; flux and the registry login come from the step above.
      - name: Move the main tag
        if: github.event_name == 'push'
        run: flux tag artifact "oci://ghcr.io/hwinther/skylens/manifests:${TAG}" --tag main

  deploy-preview:
    needs: [manifests]
    if: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'deploy-feature') }}
    permissions:
      contents: read
      pull-requests: write
    uses: hwinther/reusable-workflows/.github/workflows/gitops-preview-upsert.yml@6b6810e17143f38ac9dc0f84d504e7ff08b1d2bf # v2.26.0
    with:
      target_repo: hwinther/proxmox
      preview_base_path: clusters/production/apps/previews/skylens
      pr_number: ${{ github.event.pull_request.number }}
      host: skylens-${{ github.event.pull_request.number }}.preview.wsh.no
      app_name: skylens
      # The preview template pins the manifest artifact (which pins the image), not the image.
      image_tag: ${{ needs.manifests.outputs.tag }}
      image_digest: ${{ needs.manifests.outputs.digest }}
      client_id: ${{ vars.PROXMOX_GITOPS_CLIENT_ID }}
    secrets:
      app_private_key: ${{ secrets.PROXMOX_GITOPS_APP_PRIVATE_KEY }}

  comment:
    needs: [deploy-preview, manifests]
    if: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'deploy-feature') }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Post or update the preview-URL sticky comment
        uses: hwinther/reusable-workflows/.github/actions/sticky-pr-comment@5ba6e5a72dec8dcd121cc864279889bb2fa6ed73 # v2.31.0
        with:
          github_token: ${{ github.token }}
          comment_identifier: skylens-preview-env
          comment_content: |
            ### Preview environment

            Deployed via Flux (reconciles within ~1 min) after the image passed Playwright e2e,
            from the signed manifest artifact `manifests:${{ needs.manifests.outputs.tag }}`
            (this PR's `deploy/` plus `components/preview`).
            Runs the backend in Development mode (MQTT replay of the baked-in fixture) with REAL
            OIDC JWT auth, so the production sign-in path is testable here.

            - Preview URL: ${{ needs.deploy-preview.outputs.preview_url }}

            Access to the host is gated by the Authelia forward-auth middleware on the ingress;
            in-app sign-in then works like production, provided this PR number is inside the
            registered redirect-URI window on the Authelia `skylens` client (see
            authelia-helmrelease.yaml in hwinther/proxmox — extend the window when exhausted).
            Anonymous visitors see a disconnected, empty feed (the /hubs connection is rejected
            with 401 until sign-in, same as production).

            Closing the PR removes the env via `pr-preview-cleanup.yml`.

  # The run's test, coverage, warning and scan results (every quality-* artifact) as the signed OCI
  # artifact ghcr.io/<owner>/<repo>/quality:main-<sha7> plus the moving :main, and as the workflow
  # artifact quality-summary that wshno/devops' repository report reads. Also runs when a test job
  # failed, so the failures are reported.
  quality:
    needs: [main-tag, unit, e2e, scan, build]
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: hwinther/reusable-workflows/.github/workflows/quality-artifact.yml@56a8121d7a91b3c48c444c7b3fde8d0801320f08 # v2.35.0
    with:
      tags: |
        ${{ needs.main-tag.outputs.tag }}
        main
      version: ${{ needs.build.outputs.version }}
