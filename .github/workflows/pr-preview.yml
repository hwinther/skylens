name: "PR preview"

# Builds + pushes the PR image, runs a Playwright e2e against it, then deploys an ephemeral preview
# env to the homelab cluster via GitOps (renders the per-PR overlay under
# clusters/production/apps/previews/skylens in hwinther/proxmox; Flux reconciles within ~1 min).
#
# The preview runs the backend in Development mode (DevAuth + MQTT replay of the baked-in fixture),
# so it needs no secrets, no broker, and no database; the Authelia forward-auth ingress is the gate.
#
# Opt-in per PR via the `deploy-feature` label. Requires repo secrets PROXMOX_GITOPS_APP_ID +
# PROXMOX_GITOPS_APP_PRIVATE_KEY (the GitHub App that can commit to hwinther/proxmox).

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled]

concurrency:
  group: "pr-preview-${{ github.event.pull_request.number }}"
  cancel-in-progress: true

jobs:
  build:
    if: contains(github.event.pull_request.labels.*.name, 'deploy-feature')
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write
      actions: write
      pull-requests: write
    uses: hwinther/reusable-workflows/.github/workflows/docker-container.yml@00fef736b925dfc7b70ab0476276ae1f59e1683b # v2.0.1
    with:
      container_registry: ghcr.io
      container_image_name_postfix: api
      build_context: .
      dockerfile: Dockerfile
      platforms: linux/amd64
      # auto = report/SARIF only on PRs (fails on other events).
      grype_fail_build: auto

  e2e:
    needs: build
    if: contains(github.event.pull_request.labels.*.name, 'deploy-feature')
    permissions:
      contents: read
      packages: read
      pull-requests: write
      actions: read
    uses: hwinther/reusable-workflows/.github/workflows/playwright-e2e.yml@00fef736b925dfc7b70ab0476276ae1f59e1683b # v2.0.1
    with:
      compose_file: docker-compose.e2e.yml
      playwright_working_directory: app
      # v2 pushes the image to GHCR (no loadable artifact), so there is nothing to `docker load`; the
      # empty map makes the reusable skip artifact loading and `docker compose pull` the image instead.
      image_artifacts_json: "{}"
      # setup-node's registry-url defaults to GitHub Packages, which would repoint the GLOBAL npm
      # registry and break `npm ci` of the app's public deps. Pin it back to public npm.
      npm_registry_url: https://registry.npmjs.org
      # The reusable exports playwright_env AFTER `docker compose up`, so API_IMAGE cannot be passed
      # that way for compose image resolution. The install command runs BEFORE compose up, so we set
      # API_IMAGE (to the exact digest the build pushed) into $GITHUB_ENV there; `docker compose pull`
      # / `up` then resolve it from GHCR (the reusable already logs into ghcr.io).
      playwright_install_command: 'npm ci && echo "API_IMAGE=ghcr.io/hwinther/skylens/api@${{ needs.build.outputs.image_digest }}" >> "$GITHUB_ENV"'
      playwright_run_command: npm run e2e:ci
      # Base URL the CI config reads (defaults to the same value; set explicitly for clarity).
      playwright_env: |
        E2E_BASE_URL=http://localhost:8081

  # The preview deploys from a rendered, signed manifest artifact (deploy/ + components/preview),
  # so manifest changes in a PR run in its preview before they reach a release. The cluster repo's
  # preview template pins it by digest and only accepts this workflow's signature.
  manifests:
    needs: build
    if: contains(github.event.pull_request.labels.*.name, 'deploy-feature')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      tag: ${{ steps.push.outputs.tag }}
      digest: ${{ steps.push.outputs.digest }}
    env:
      IMAGE: ghcr.io/hwinther/skylens/api:${{ needs.build.outputs.version }}@${{ needs.build.outputs.image_digest }}
      TAG: pr-${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      KUBECONFORM_VERSION: v0.8.0
      KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Flux CLI
        uses: fluxcd/flux2/action@b9c17924adb533d3617ec7de97a7b0f4acc07b39 # v2.9.6

      - name: Set up cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Install kubeconform
        run: |
          curl -fsSLo /tmp/kubeconform.tgz "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  /tmp/kubeconform.tgz" | sha256sum -c -
          tar -xzf /tmp/kubeconform.tgz -C /usr/local/bin kubeconform

      - name: Render
        run: .github/scripts/render-manifests.sh deploy dist/skylens.yaml "$IMAGE" components/preview

      - name: Validate
        run: kubeconform -strict -summary dist/skylens.yaml

      - name: Push and sign
        id: push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          digest="$(flux push artifact "oci://ghcr.io/hwinther/skylens/manifests:${TAG}" \
            --path=dist \
            --source="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --revision="${TAG}@sha1:${HEAD_SHA}" \
            --output=json | jq -r '.digest')"
          cosign sign --yes "ghcr.io/hwinther/skylens/manifests@${digest}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

  deploy-preview:
    needs: [build, e2e, manifests]
    if: contains(github.event.pull_request.labels.*.name, 'deploy-feature')
    permissions:
      contents: read
      pull-requests: write
    uses: hwinther/reusable-workflows/.github/workflows/gitops-preview-upsert.yml@00fef736b925dfc7b70ab0476276ae1f59e1683b # v2.0.1
    with:
      target_repo: hwinther/proxmox
      preview_base_path: clusters/production/apps/previews/skylens
      pr_number: ${{ github.event.pull_request.number }}
      host: skylens-${{ github.event.pull_request.number }}.preview.wsh.no
      app_name: skylens
      # The preview template pins the manifest artifact (which pins the image), not the image.
      image_tag: ${{ needs.manifests.outputs.tag }}
      image_digest: ${{ needs.manifests.outputs.digest }}
    secrets:
      app_id: ${{ secrets.PROXMOX_GITOPS_APP_ID }}
      app_private_key: ${{ secrets.PROXMOX_GITOPS_APP_PRIVATE_KEY }}

  comment:
    needs: [deploy-preview, manifests]
    if: contains(github.event.pull_request.labels.*.name, 'deploy-feature')
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Post or update the preview-URL sticky comment
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: skylens-preview-env
          message: |
            ### Preview environment

            Deployed via Flux (reconciles within ~1 min) after the image passed Playwright e2e,
            from the signed manifest artifact `manifests:${{ needs.manifests.outputs.tag }}`
            (this PR's `deploy/` plus `components/preview`).
            Runs the backend in Development mode (MQTT replay of the baked-in fixture) with REAL
            OIDC JWT auth, so the production sign-in path is testable here.

            - Preview URL: ${{ needs.deploy-preview.outputs.preview_url }}

            Access to the host is gated by the Authelia forward-auth middleware on the ingress;
            in-app sign-in then works like production, provided this PR number is inside the
            registered redirect-URI window on the Authelia `skylens` client (see
            authelia-helmrelease.yaml in hwinther/proxmox — extend the window when exhausted).
            Anonymous visitors see a disconnected, empty feed (the /hubs connection is rejected
            with 401 until sign-in, same as production).

            Closing the PR removes the env via `pr-preview-cleanup.yml`.
