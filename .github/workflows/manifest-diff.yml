name: "Manifest diff"

# Renders deploy/ for the PR head and its base, validates the head, and writes the rendered diff to
# the job summary, so manifest review happens here rather than in the cluster repo's tag bump.
# Both sides keep the placeholder image tag; the release job pins the real tag@digest.

on:
  pull_request:
    paths:
      - "deploy/**"
      - ".github/scripts/render-manifests.sh"
      - ".github/workflows/manifest-diff.yml"

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }} @ ${{ github.head_ref }}"
  cancel-in-progress: true

jobs:
  diff:
    runs-on: ubuntu-latest
    env:
      KUBECONFORM_VERSION: v0.8.0
      KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
    steps:
      - name: Checkout head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .base
          persist-credentials: false

      - name: Install kubeconform
        run: |
          curl -fsSLo /tmp/kubeconform.tgz "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  /tmp/kubeconform.tgz" | sha256sum -c -
          tar -xzf /tmp/kubeconform.tgz -C /usr/local/bin kubeconform

      - name: Render head
        run: .github/scripts/render-manifests.sh deploy /tmp/head.yaml

      - name: Validate head
        run: kubeconform -strict -summary /tmp/head.yaml

      - name: Render base
        # The head's script renders the base tree, so a script change can't make the base fail.
        # The base contract isn't this PR's problem, so its result is ignored.
        run: |
          if [ -d .base/deploy ]; then
            .github/scripts/render-manifests.sh .base/deploy /tmp/base.yaml || true
          fi
          touch /tmp/base.yaml

      - name: Diff
        run: |
          {
            echo "### Rendered manifest diff"
            echo
            if diff -u --label base --label head /tmp/base.yaml /tmp/head.yaml > /tmp/manifests.diff; then
              echo "No change to the rendered manifests."
            else
              echo '```diff'
              cat /tmp/manifests.diff
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
