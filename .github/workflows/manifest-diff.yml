name: "Manifest diff"

# Renders deploy/ (production and the PR-preview variant) for the PR head and its base, validates
# the head, and posts a review report (resource map per render plus a dyff per changed resource) to
# the job summary and a sticky PR comment, so manifest review happens here rather than in the
# cluster repo's tag bump. Both sides keep the placeholder image tag; releases pin tag@digest.

on:
  pull_request:
    paths:
      - "deploy/**"
      - ".github/workflows/manifest-diff.yml"

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }} @ ${{ github.head_ref }}"
  cancel-in-progress: true

jobs:
  diff:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Render, validate and report
        uses: hwinther/reusable-workflows/.github/actions/manifests@c1e80ad637dcdd38bb6de0f447475c40a8625141 # v2.9.0
        with:
          mode: diff
          renders: |
            skylens.yaml=deploy
            preview.yaml=deploy,components/preview
