name: "Publish container to GHCR"

# Single API image (ASP.NET Core gateway + baked aircraft.csv.gz enrichment DB). Built from the
# repo-root Dockerfile. Pure .NET so multi-arch is fine, but the reusable workflow builds for the
# runner arch (amd64) by default, which is all the skylens-production deployment needs.

on:
  workflow_dispatch:
    inputs:
      grype_fail_build:
        description: "Fail the build if Grype finds vulnerabilities"
        type: boolean
        default: true
  push:
    tags:
      - "v*"

concurrency:
  group: "${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}"
  cancel-in-progress: true

jobs:
  container:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      actions: write
      security-events: write
      pull-requests: write
    uses: hwinther/reusable-workflows/.github/workflows/docker-container.yml@00fef736b925dfc7b70ab0476276ae1f59e1683b # v2.0.1
    with:
      container_registry: ghcr.io
      container_image_name_postfix: api
      build_context: .
      dockerfile: Dockerfile
      # v2 string enum: 'never' only when a manual run unchecks the box; otherwise 'auto' (fail on release builds).
      grype_fail_build: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.grype_fail_build == 'false' && 'never' || 'auto' }}

  # Renders deploy/ with the image just pushed (tag@digest), and ships it as a signed OCI artifact
  # (ghcr.io/hwinther/skylens/manifests:<version>) for Flux in hwinther/proxmox to pull. Release
  # builds only: the tag-and-release workflow dispatches this workflow at the tag ref, so the
  # cosign identity is container.yml@refs/tags/v*, which the OCIRepository verify pins.
  manifests:
    needs: container
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      VERSION: ${{ needs.container.outputs.version }}
      DIGEST: ${{ needs.container.outputs.image_digest }}
      KUBECONFORM_VERSION: v0.8.0
      KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Flux CLI
        uses: fluxcd/flux2/action@b9c17924adb533d3617ec7de97a7b0f4acc07b39 # v2.9.6

      - name: Set up cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Install kubeconform
        run: |
          curl -fsSLo /tmp/kubeconform.tgz "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  /tmp/kubeconform.tgz" | sha256sum -c -
          tar -xzf /tmp/kubeconform.tgz -C /usr/local/bin kubeconform

      - name: Render
        run: .github/scripts/render-manifests.sh deploy dist/skylens.yaml "ghcr.io/hwinther/skylens/api:${VERSION}@${DIGEST}"

      - name: Validate
        run: kubeconform -strict -summary dist/skylens.yaml

      - name: Push and sign
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # flux push and cosign both read ~/.docker/config.json.
          echo "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          ref="$(flux push artifact "oci://ghcr.io/hwinther/skylens/manifests:${VERSION}" \
            --path=dist \
            --source="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --revision="${GITHUB_REF_NAME}@sha1:${GITHUB_SHA}" \
            --output=json | jq -r '.repository + "@" + .digest')"
          cosign sign --yes "$ref"
          {
            echo "### Manifest artifact"
            echo
            echo "\`${ref}\` (tag \`${VERSION}\`), signed."
          } >> "$GITHUB_STEP_SUMMARY"
