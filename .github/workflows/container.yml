name: "Publish container to GHCR"

# Single API image (ASP.NET Core gateway + baked aircraft.csv.gz enrichment DB). Built from the
# repo-root Dockerfile. Pure .NET so multi-arch is fine, but the reusable workflow builds for the
# runner arch (amd64) by default, which is all the skylens-production deployment needs.

on:
  workflow_dispatch:
    inputs:
      grype_fail_build:
        description: "Fail the build if Grype finds vulnerabilities"
        type: boolean
        default: true
  push:
    tags:
      - "v*"

concurrency:
  group: "${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}"
  cancel-in-progress: true

jobs:
  container:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      actions: write
      security-events: write
      pull-requests: write
    uses: hwinther/reusable-workflows/.github/workflows/docker-container.yml@00fef736b925dfc7b70ab0476276ae1f59e1683b # v2.0.1
    with:
      container_registry: ghcr.io
      container_image_name_postfix: api
      build_context: .
      dockerfile: Dockerfile
      # v2 string enum: 'never' only when a manual run unchecks the box; otherwise 'auto' (fail on release builds).
      grype_fail_build: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.grype_fail_build == 'false' && 'never' || 'auto' }}

  # Renders deploy/ with the image just pushed (tag@digest), and ships it as a signed OCI artifact
  # (ghcr.io/hwinther/skylens/manifests:<version>) for Flux in hwinther/proxmox to pull. Release
  # builds only: the tag-and-release workflow dispatches this workflow at the tag ref, so the
  # cosign identity is container.yml@refs/tags/v*, which the OCIRepository verify pins.
  manifests:
    needs: container
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Signed in this job, so the artifact's cosign identity is container.yml@refs/tags/v*, which
      # the cluster's OCIRepository pins. A single file at the root: the Flux Kustomization applies
      # everything under its path.
      - name: Render, validate, push and sign
        uses: hwinther/reusable-workflows/.github/actions/manifests@1e9758076ae2bfdaedec524c2a9834c9488207cf # feat/manifests-action (pre-release)
        with:
          mode: push
          artifact: ghcr.io/hwinther/skylens/manifests
          tag: ${{ needs.container.outputs.version }}
          images: ghcr.io/hwinther/skylens/api:${{ needs.container.outputs.version }}@${{ needs.container.outputs.image_digest }}
          renders: skylens.yaml=deploy
